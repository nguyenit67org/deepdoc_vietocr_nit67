pdf:
  dpi: 200
crop_whitespace:
  enabled: true
page_deskew:
  enabled: false
page_orientation:
  enabled: false
remove_red:
  enabled: false
layout:
  backend: pp_doclayout
  model_name: PP-DocLayout_plus-L
  model_dir: /app/models/layout
  device: cpu
  threshold: 0.2
  max_batch_size: 1
ocr:
  model_dir: /app/models/detector
  det_backend: onnx
  crop_pad_px_h: 3
  crop_pad_px_w: 0
  max_batch_size: 1
  recognizer:
    backend: vietocr_original
    model_dir: /app/models/vietocr
    device: cpu
    max_batch_size: 16
    max_seq_length: 128
table:
  enabled: false
corrector:
  enabled: false
extract:
  enabled: false
pipeline:
  max_pages_per_batch: 4
output:
  persist: false
  dir: /tmp/ocr-unused-output
debug:
  enabled: false
