pdf:
  dpi: 200

crop_whitespace:
  enabled: true
  threshold: 200
  dilate_kernel: [15, 15]
  dilate_iter: 3
  margin: 15
  open_kernel: [3, 3]
  min_contour_area_ratio: 0.0008
  max_content_area_ratio: 0.5

page_deskew:
  enabled: true   
  min_boxes: 5
  angle_threshold: 0.5
  max_angle: 10.0

page_orientation:
  enabled: true   
  score_threshold: 0.9
  sample_max: 20
  min_scores: 5
  sideways_min_count: 4
  sideways_min_ratio: 0.3
  max_pages_per_batch: 30  # vram : ~8.15 gb (reserved, log peak 8150MB)

layout:
  backend: pp_doclayout
  model_name: PP-DocLayout_plus-L
  threshold: 0.2
  max_batch_size: 16   # vram : ~5.04 gb (reserved, log peak 5035MB)

ocr:
  model_dir: null
  det_backend: mineru 
  fastocr_weight_path: "fastocr/weight/FastOcr.pth"
  fastocr_base_config: "vgg_seq2seq"
  crop_pad_px_h: 3
  crop_pad_px_w: 0
  max_batch_size: 8    # vram : 24 (bước "Detecting bboxes" không có log [gpu-mem])
  fastocr_max_batch_size: 600 # vram : ~9.14 gb (reserved, log peak 9142MB)

tsr:
  threshold: 0.2

table:
  backend: mineru  
  max_batch_size: 64    # vram : 13 (bước "Recognizing tables"/Surya không có log [gpu-mem])
  wired_max_batch_size: 32   # vram : chưa đo được (UNet batch_predict không có log [gpu-mem])

mapping:
  overlap_threshold: 0.5
  figure_drop_types: [image]
  figure_drop_ratio: 0.4
  line_overlap_min: 0.5

reading_order:
  single_page_ratio_max: 0.85
  spanning_min_ratio: 0.15
  anchor_min_width: 100
  anchor_band_mult: 1.0

batch_api:
  # /api/v1/ocr/pdfs: max total pages across multiple PDFs grouped into one batch
  max_pages_per_group: 200
  # /api/v1/ocr/images: max images grouped into one batch
  max_images_per_group: 200

output:
  dir: "./pipeline_outputs"

debug:
  enabled: false
  dir: "./debug_outputs"
