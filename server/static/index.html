<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FastOCR Debug</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <style>
            :root {
                --primary: #111827;
                --background: #f8fafc;
                --surface: #ffffff;
                --surface-alt: #f1f5f9;
                --text: #172033;
                --muted: #64748b;
                --outline: #cbd5e1;
                --error: #b91c1c;
                --success: #15803d;
                --layout: #2563eb;
                --ocr: #f59e0b;
                --blocks: #8b5cf6;
                --extraction: #16a34a;
                --radius: 10px;
                --radius-sm: 6px;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                min-height: 100%;
                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                color: var(--text);
                background: var(--background);
            }
            header {
                position: sticky;
                top: 0;
                z-index: 100;
                display: flex;
                align-items: center;
                gap: 10px;
                height: 56px;
                padding: 0 20px;
                background: rgba(248, 250, 252, 0.94);
                border-bottom: 1px solid #e2e8f0;
                backdrop-filter: blur(12px);
                font-weight: 700;
            }
            .logo {
                display: grid;
                place-items: center;
                width: 30px;
                height: 30px;
                border-radius: 8px;
                color: white;
                background: var(--primary);
            }
            .version {
                padding: 2px 8px;
                border-radius: 999px;
                color: var(--muted);
                background: #e2e8f0;
                font-size: 10px;
            }
            .app {
                display: grid;
                grid-template-columns: 280px minmax(420px, 1.25fr) minmax(
                        320px,
                        0.9fr
                    );
                gap: 14px;
                height: calc(100vh - 56px);
                padding: 14px;
            }
            .panel {
                min-width: 0;
                overflow: auto;
                padding: 16px;
                border: 1px solid #e2e8f0;
                border-radius: var(--radius);
                background: var(--surface);
                box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            }
            h2 {
                margin: 0 0 10px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.07em;
                text-transform: uppercase;
            }
            .dropzone {
                display: grid;
                place-items: center;
                min-height: 150px;
                padding: 20px;
                border: 2px dashed var(--outline);
                border-radius: var(--radius);
                color: var(--muted);
                background: var(--surface-alt);
                text-align: center;
                cursor: pointer;
            }
            .dropzone.drag,
            .dropzone:hover {
                border-color: var(--primary);
            }
            .dropzone strong {
                display: block;
                margin-bottom: 5px;
                color: var(--text);
                font-size: 13px;
            }
            input[type='file'] {
                display: none;
            }
            .filename {
                margin-top: 10px;
                padding: 8px;
                border-radius: var(--radius-sm);
                background: var(--surface-alt);
                font-size: 12px;
                overflow-wrap: anywhere;
            }
            button {
                border: 0;
                border-radius: var(--radius-sm);
                color: white;
                background: var(--primary);
                font:
                    600 12px Inter,
                    sans-serif;
                cursor: pointer;
            }
            button:disabled {
                color: #94a3b8;
                background: #e2e8f0;
                cursor: not-allowed;
            }
            #submitBtn {
                width: 100%;
                margin-top: 10px;
                padding: 10px;
            }
            .status {
                margin-top: 10px;
                font-size: 12px;
                line-height: 1.5;
            }
            .status.ok {
                color: var(--success);
            }
            .status.err {
                color: var(--error);
                white-space: pre-wrap;
            }
            .spinner {
                display: inline-block;
                width: 12px;
                height: 12px;
                margin-right: 6px;
                border: 2px solid #cbd5e1;
                border-top-color: var(--primary);
                border-radius: 50%;
                vertical-align: -2px;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .tabs {
                display: flex;
                gap: 4px;
                margin-bottom: 12px;
                border-bottom: 1px solid #e2e8f0;
            }
            .tab {
                padding: 7px 12px;
                border-bottom: 2px solid transparent;
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
            }
            .tab.active {
                border-bottom-color: var(--primary);
                color: var(--primary);
            }
            .tab-pane {
                display: none;
            }
            .tab-pane.active {
                display: block;
            }
            #jsonOut {
                margin: 0;
                max-height: 420px;
                padding: 10px;
                overflow: auto;
                border: 1px solid var(--outline);
                border-radius: var(--radius-sm);
                background: var(--surface-alt);
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font:
                    11.5px/1.55 ui-monospace,
                    SFMono-Regular,
                    Consolas,
                    monospace;
            }
            .placeholder {
                color: var(--muted);
                font-size: 12px;
            }
            .layer-controls {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 10px;
            }
            .layer-toggle {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 5px 8px;
                border: 1px solid var(--outline);
                border-radius: 999px;
                background: var(--surface-alt);
                font-size: 10.5px;
                font-weight: 600;
                cursor: pointer;
                user-select: none;
            }
            .layer-toggle input {
                margin: 0;
            }
            .layer-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
            }
            .page-nav {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                color: var(--muted);
                font-size: 11.5px;
            }
            .page-nav button {
                padding: 4px 9px;
            }
            #previewCanvasWrap {
                overflow: auto;
                border: 1px solid var(--outline);
                border-radius: var(--radius-sm);
                background: #e2e8f0;
            }
            .preview-stage {
                position: relative;
                display: inline-block;
            }
            #previewCanvas {
                display: block;
                max-width: 100%;
                height: auto;
            }
            #bboxOverlay {
                position: absolute;
                inset: 0;
            }
            .bbox-box {
                position: absolute;
                border: 2px solid;
                cursor: pointer;
                transition:
                    background 0.1s,
                    border-width 0.1s;
            }
            .bbox-box:hover,
            .bbox-box.hovered {
                border-width: 3px;
                background: rgba(15, 23, 42, 0.12);
            }
            .bbox-box.selected {
                border-width: 4px;
                background: rgba(22, 163, 74, 0.18);
            }
            .bbox-box[data-layer='layout'] {
                z-index: 10;
            }
            .bbox-box[data-layer='ocr'] {
                z-index: 20;
            }
            .bbox-box[data-layer='blocks'] {
                z-index: 30;
            }
            .bbox-box[data-layer='extraction'] {
                z-index: 40;
            }
            .bbox-label {
                position: absolute;
                top: -15px;
                left: -2px;
                max-width: 190px;
                padding: 1px 4px;
                color: white;
                font:
                    9.5px/13px ui-monospace,
                    Consolas,
                    monospace;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .debug-card {
                margin-top: 10px;
                padding: 10px;
                border: 1px solid var(--outline);
                border-radius: var(--radius-sm);
                background: var(--surface-alt);
                font-size: 11px;
                line-height: 1.5;
            }
            .debug-card pre {
                margin: 5px 0 0;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font:
                    10.5px/1.45 ui-monospace,
                    Consolas,
                    monospace;
            }
            .extraction-fields {
                display: grid;
                gap: 10px;
            }
            .form-field {
                padding: 8px;
                border: 1px solid var(--outline);
                border-radius: var(--radius-sm);
                background: var(--surface);
            }
            .form-field.selected {
                border-color: var(--extraction);
                background: #dcfce7;
            }
            .form-head {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 6px;
            }
            .form-label {
                font-size: 11px;
                font-weight: 700;
            }
            .evidence-btn {
                margin-left: auto;
                padding: 3px 8px;
                color: white;
                background: #15803d;
                font-size: 10px;
                white-space: nowrap;
            }
            .evidence-btn:hover:not(:disabled) {
                background: #166534;
            }
            .form-field.selected .evidence-btn:not(:disabled) {
                background: #166534;
            }
            .evidence-btn:disabled {
                color: #94a3b8;
                background: #e2e8f0;
            }
            .form-input,
            .form-select {
                width: 100%;
                padding: 7px 8px;
                border: 1px solid var(--outline);
                border-radius: var(--radius-sm);
                color: var(--text);
                background: #f8fafc;
                font-size: 12px;
                font-family: inherit;
            }
            textarea.form-input {
                min-height: 38px;
                line-height: 1.5;
                resize: vertical;
            }
            .form-select:disabled {
                color: var(--text);
                opacity: 1;
            }
            .form-hint {
                margin-top: 4px;
                color: var(--muted);
                font-size: 10px;
            }
            .field-key {
                font-weight: 700;
            }
            .field-status {
                margin-left: 5px;
                padding: 1px 5px;
                border-radius: 999px;
                background: #e2e8f0;
                font-size: 9px;
                text-transform: uppercase;
            }
            .field-value {
                display: block;
                margin-top: 3px;
                overflow-wrap: anywhere;
            }
            .md-body {
                font-size: 13px;
                line-height: 1.6;
            }
            .md-body h1 {
                font-size: 19px;
            }
            .md-body h2 {
                color: inherit;
                font-size: 16px;
                letter-spacing: 0;
                text-transform: none;
            }
            .md-body table {
                border-collapse: collapse;
            }
            .md-body th,
            .md-body td {
                padding: 4px 7px;
                border: 1px solid var(--outline);
            }
            .md-block {
                border-radius: 3px;
                scroll-margin: 60px;
            }
            .md-block.highlight {
                background: #fef9c3;
                outline: 2px solid #eab308;
            }
            .md-page-divider {
                margin: 14px 0 6px;
                padding-top: 6px;
                border-top: 1px dashed var(--outline);
                color: var(--muted);
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
            }
            @media (max-width: 1100px) {
                .app {
                    grid-template-columns: 240px 1fr;
                    height: auto;
                }
                .panel-markdown {
                    grid-column: 1 / -1;
                    max-height: 600px;
                }
            }
            @media (max-width: 720px) {
                .app {
                    grid-template-columns: 1fr;
                }
                .panel-markdown {
                    grid-column: auto;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <span class="logo">D</span> FastOCR Debug
            <span class="version">v0.4</span>
        </header>
        <main class="app">
            <section class="panel">
                <h2>Upload PDF</h2>
                <label class="dropzone" id="dropzone">
                    <span
                        ><strong>Bấm để chọn file</strong>hoặc kéo thả file .pdf
                        vào đây</span
                    >
                    <input
                        type="file"
                        id="fileInput"
                        accept="application/pdf,.pdf"
                    />
                </label>
                <div class="filename" id="filename">Chưa chọn file</div>
                <button id="submitBtn" disabled>Xử lý</button>
                <div class="status" id="status"></div>
            </section>

            <section class="panel">
                <div class="layer-controls" id="layerControls">
                    <label class="layer-toggle"
                        ><input type="checkbox" data-layer="layout" /><span
                            class="layer-dot"
                            style="background: var(--layout)"
                        ></span
                        >Layout <span data-count="layout">0</span></label
                    >
                    <label class="layer-toggle"
                        ><input type="checkbox" data-layer="ocr" /><span
                            class="layer-dot"
                            style="background: var(--ocr)"
                        ></span
                        >OCR <span data-count="ocr">0</span></label
                    >
                    <label class="layer-toggle"
                        ><input
                            type="checkbox"
                            data-layer="blocks"
                            checked
                        /><span
                            class="layer-dot"
                            style="background: var(--blocks)"
                        ></span
                        >Blocks <span data-count="blocks">0</span></label
                    >
                    <label class="layer-toggle"
                        ><input type="checkbox" data-layer="extraction" /><span
                            class="layer-dot"
                            style="background: var(--extraction)"
                        ></span
                        >Extraction
                        <span data-count="extraction">0</span></label
                    >
                </div>
                <div class="page-nav" id="pageNav" style="display: none">
                    <button id="prevPageBtn">&larr;</button>
                    <span id="pageIndicator">Trang 1 / 1</span>
                    <button id="nextPageBtn">&rarr;</button>
                </div>
                <div id="previewCanvasWrap" style="display: none">
                    <div class="preview-stage">
                        <canvas id="previewCanvas"></canvas>
                        <div id="bboxOverlay"></div>
                    </div>
                </div>
                <div id="previewPlaceholder" class="placeholder">
                    Chưa có kết quả
                </div>
                <div class="debug-card" id="debugInspector">
                    Chọn hoặc di chuột lên một vùng để xem chi tiết.
                </div>
            </section>

            <section class="panel panel-markdown">
                <div class="tabs">
                    <div class="tab active" data-tab="extraction">
                        Extraction fields
                    </div>
                    <div class="tab" data-tab="markdown">Markdown</div>
                    <div class="tab" data-tab="json">JSON</div>
                </div>
                <div id="markdownPane" class="tab-pane">
                    <div class="md-body" id="mdOut">
                        <span class="placeholder">Chưa có kết quả</span>
                    </div>
                </div>
                <div id="extractionPane" class="tab-pane active">
                    <div class="extraction-fields" id="extractionFields">
                        <span class="placeholder">Chưa có kết quả</span>
                    </div>
                </div>
                <pre
                    id="jsonOut"
                    class="tab-pane"
                ><span class="placeholder">Chưa có kết quả</span></pre>
            </section>
        </main>

        <script>
            const COLORS = {
                layout: '#2563eb',
                ocr: '#f59e0b',
                blocks: '#8b5cf6',
                extraction: '#16a34a',
            };
            const TITLE_TYPES = new Set(['doc_title']);
            const H2_TYPES = new Set(['paragraph_title']);

            const el = Object.fromEntries(
                [
                    'dropzone',
                    'fileInput',
                    'filename',
                    'submitBtn',
                    'status',
                    'jsonOut',
                    'markdownPane',
                    'extractionPane',
                    'previewPlaceholder',
                    'previewCanvasWrap',
                    'previewCanvas',
                    'bboxOverlay',
                    'pageNav',
                    'pageIndicator',
                    'prevPageBtn',
                    'nextPageBtn',
                    'debugInspector',
                    'extractionFields',
                    'mdOut',
                    'layerControls',
                ].map((id) => [id, document.getElementById(id)]),
            );

            const FIELD_ORDER = [
                'type',
                'title',
                'code',
                'documentDate',
                'officeSender',
                'priority_level',
                'security_level',
                'recipients',
                'signer',
                'first_recipients',
                'signer_title',
                'province',
                'receiverDate',
            ];
            const PRIORITY_OPTIONS = [
                '0_BÌNH THƯỜNG',
                '1_HỎA TỐC',
                '2_KHẨN',
                '3_THƯỢNG KHẨN',
            ];
            const SECURITY_OPTIONS = [
                '0_BÌNH THƯỜNG',
                '1_MẬT',
                '2_TỐI MẬT',
                '3_TUYỆT MẬT',
            ];
            const LONG_FIELDS = new Set([
                'title',
                'officeSender',
                'recipients',
                'first_recipients',
                'signer_title',
            ]);

            let selectedFile = null;
            let debugData = null;
            let apiInformation = null;
            let currentPage = 1;
            let selectedField = null;
            let renderToken = 0;
            const layers = {
                layout: false,
                ocr: false,
                blocks: true,
                extraction: false,
            };

            function setStatus(message, kind = '') {
                el.status.className = 'status ' + kind;
                el.status.textContent = message;
            }

            function formatSeconds(value) {
                if (typeof value !== 'number' || !isFinite(value)) return '—';
                if (value < 60) return value.toFixed(2) + 's';
                const minutes = Math.floor(value / 60);
                const seconds = value - minutes * 60;
                return minutes + 'm ' + seconds.toFixed(1) + 's';
            }

            function renderTiming(serverSeconds, clientSeconds) {
                const serverText = formatSeconds(serverSeconds);
                const clientText = formatSeconds(clientSeconds);
                el.status.className = 'status ok';
                el.status.textContent =
                    'Thời gian xử lý: ' +
                    serverText +
                    ' (server) · ' +
                    clientText +
                    ' (tổng)';
            }

            function resetOutput() {
                debugData = null;
                apiInformation = null;
                currentPage = 1;
                selectedField = null;
                renderToken += 1;
                el.previewCanvasWrap.style.display = 'none';
                el.pageNav.style.display = 'none';
                el.previewPlaceholder.style.display = '';
                el.previewPlaceholder.textContent = 'Chưa có kết quả';
                el.bboxOverlay.innerHTML = '';
                el.debugInspector.textContent =
                    'Chọn hoặc di chuột lên một vùng để xem chi tiết.';
                el.extractionFields.innerHTML =
                    '<span class="placeholder">Chưa có kết quả</span>';
                for (const name of Object.keys(layers)) updateCount(name, 0);
            }

            function updateCount(layer, count) {
                const target = el.layerControls.querySelector(
                    '[data-count="' + layer + '"]',
                );
                if (target) target.textContent = count;
            }

            function showInspector(title, data) {
                el.debugInspector.innerHTML = '';
                const heading = document.createElement('strong');
                heading.textContent = title;
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(data, null, 2);
                el.debugInspector.append(heading, pre);
            }

            function blockToMarkdown(block) {
                const content = (block.content || '').trim();
                if (!content || block.content_type === 'skip') return null;
                if (block.content_type === 'table') return content;
                const type = (block.type || '').toLowerCase();
                if (TITLE_TYPES.has(type)) return '# ' + content;
                if (H2_TYPES.has(type)) return '## ' + content;
                return content;
            }

            function clearHover() {
                document
                    .querySelectorAll('.bbox-box.hovered')
                    .forEach((node) => node.classList.remove('hovered'));
                document
                    .querySelectorAll('.md-block.highlight')
                    .forEach((node) => node.classList.remove('highlight'));
            }

            function setHovered(page, blockId, source) {
                clearHover();
                if (blockId == null) return;
                if (page === currentPage) {
                    el.bboxOverlay
                        .querySelectorAll('[data-block-id="' + blockId + '"]')
                        .forEach((node) => node.classList.add('hovered'));
                }
                const markdownBlock = el.mdOut.querySelector(
                    '.md-block[data-page="' +
                        page +
                        '"][data-block-id="' +
                        blockId +
                        '"]',
                );
                if (markdownBlock) {
                    markdownBlock.classList.add('highlight');
                    if (source === 'image')
                        markdownBlock.scrollIntoView({
                            block: 'center',
                            behavior: 'smooth',
                        });
                }
            }

            function renderMarkdown() {
                el.mdOut.innerHTML = '';
                if (!debugData) {
                    el.mdOut.innerHTML =
                        '<span class="placeholder">Server đang tắt debug visualization</span>';
                    return;
                }
                for (const page of debugData.pages) {
                    const divider = document.createElement('div');
                    divider.className = 'md-page-divider';
                    divider.textContent = 'Trang ' + page.page;
                    el.mdOut.appendChild(divider);
                    for (const block of page.blocks) {
                        const source = blockToMarkdown(block);
                        if (source === null) continue;
                        const wrapper = document.createElement('div');
                        wrapper.className = 'md-block';
                        wrapper.dataset.page = page.page;
                        wrapper.dataset.blockId = block.id;
                        wrapper.innerHTML = window.marked
                            ? marked.parse(source)
                            : source;
                        wrapper.addEventListener('mouseenter', () =>
                            setHovered(page.page, block.id, 'markdown'),
                        );
                        wrapper.addEventListener('mouseleave', clearHover);
                        el.mdOut.appendChild(wrapper);
                    }
                }
            }

            function renderExtractionFields() {
                el.extractionFields.innerHTML = '';
                const debugFields =
                    (debugData && debugData.extraction.fields) || {};
                if (!debugData && !apiInformation) {
                    el.extractionFields.innerHTML =
                        '<span class="placeholder">Server đang tắt debug visualization</span>';
                    return;
                }
                const orderedNames = [
                    ...FIELD_ORDER,
                    ...Object.keys(debugFields).filter(
                        (name) => !FIELD_ORDER.includes(name),
                    ),
                    ...Object.keys(apiInformation || {}).filter(
                        (name) =>
                            !FIELD_ORDER.includes(name) &&
                            !(name in debugFields),
                    ),
                ];
                for (const name of orderedNames) {
                    const debugField = debugFields[name];
                    const apiValue =
                        apiInformation &&
                        apiInformation[name] &&
                        typeof apiInformation[name].value === 'string'
                            ? apiInformation[name].value
                            : undefined;
                    const value =
                        apiValue !== undefined
                            ? apiValue
                            : (debugField && debugField.value) || '';
                    const status = debugField ? debugField.status : '';
                    const evidence =
                        (debugField && debugField.evidence) || [];
                    const evidenceCount = evidence.length;

                    const card = document.createElement('div');
                    card.className =
                        'form-field' +
                        (selectedField === name ? ' selected' : '');

                    const head = document.createElement('div');
                    head.className = 'form-head';
                    const label = document.createElement('span');
                    label.className = 'form-label';
                    label.textContent = name;
                    head.appendChild(label);
                    if (status) {
                        const badge = document.createElement('span');
                        badge.className = 'field-status';
                        badge.textContent = status;
                        head.appendChild(badge);
                    }
                    const locate = document.createElement('button');
                    locate.type = 'button';
                    locate.className = 'evidence-btn';
                    locate.textContent =
                        selectedField === name
                            ? '✓ Đang xem (' + evidenceCount + ')'
                            : 'Xem vùng (' + evidenceCount + ')';
                    if (!evidenceCount) locate.textContent = 'Không có vùng';
                    locate.disabled = evidenceCount === 0;
                    if (evidenceCount) {
                        locate.title = evidenceCount + ' evidence region(s)';
                        locate.addEventListener('click', async () => {
                            if (selectedField === name) {
                                selectedField = null;
                                renderExtractionFields();
                                if (debugData)
                                    renderOverlays(
                                        debugData.pages[currentPage - 1],
                                    );
                                return;
                            }
                            selectedField = name;
                            layers.extraction = true;
                            el.layerControls.querySelector(
                                '[data-layer="extraction"]',
                            ).checked = true;
                            renderExtractionFields();
                            const first = evidence[0];
                            await renderPreviewPage(first.page);
                            showInspector(
                                'Extraction · ' + name,
                                debugField,
                            );
                        });
                    }
                    head.appendChild(locate);
                    card.appendChild(head);

                    if (
                        name === 'priority_level' ||
                        name === 'security_level'
                    ) {
                        const options =
                            name === 'priority_level'
                                ? PRIORITY_OPTIONS
                                : SECURITY_OPTIONS;
                        const select = document.createElement('select');
                        select.className = 'form-select';
                        select.disabled = true;
                        if (value && !options.includes(value)) {
                            const extra = document.createElement('option');
                            extra.value = value;
                            extra.textContent = value + ' (ngoài enum)';
                            select.appendChild(extra);
                        }
                        for (const option of options) {
                            const node = document.createElement('option');
                            node.value = option;
                            node.textContent = option;
                            select.appendChild(node);
                        }
                        select.value = value;
                        card.appendChild(select);
                    } else if (LONG_FIELDS.has(name)) {
                        const area = document.createElement('textarea');
                        area.className = 'form-input';
                        area.readOnly = true;
                        area.rows = 2;
                        area.value = value;
                        area.placeholder = '—';
                        card.appendChild(area);
                    } else {
                        const input = document.createElement('input');
                        input.className = 'form-input';
                        input.type = 'text';
                        input.readOnly = true;
                        input.value = value;
                        input.placeholder = '—';
                        card.appendChild(input);
                    }

                    if (!evidenceCount && value) {
                        const hint = document.createElement('div');
                        hint.className = 'form-hint';
                        hint.textContent = 'không có visual evidence';
                        card.appendChild(hint);
                    }
                    el.extractionFields.appendChild(card);
                }
            }

            function loadImage(src) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () =>
                        reject(new Error('Không tải được ảnh: ' + src));
                    image.src = src;
                });
            }

            function addBox(
                page,
                layer,
                item,
                bbox,
                label,
                blockId = null,
                fieldName = null,
            ) {
                const [x0, y0, x1, y1] = bbox;
                const box = document.createElement('div');
                box.className = 'bbox-box';
                box.dataset.layer = layer;
                if (blockId != null) box.dataset.blockId = blockId;
                if (fieldName) box.dataset.field = fieldName;
                box.style.borderColor = COLORS[layer];
                box.style.left = (x0 / page.width) * 100 + '%';
                box.style.top = (y0 / page.height) * 100 + '%';
                box.style.width = ((x1 - x0) / page.width) * 100 + '%';
                box.style.height = ((y1 - y0) / page.height) * 100 + '%';
                if (layer === 'extraction' && fieldName === selectedField)
                    box.classList.add('selected');

                const tag = document.createElement('span');
                tag.className = 'bbox-label';
                tag.style.background = COLORS[layer];
                tag.textContent = label;
                box.appendChild(tag);

                const inspect = () => {
                    showInspector(label, item);
                    setHovered(page.page, blockId, 'image');
                };
                box.addEventListener('mouseenter', inspect);
                box.addEventListener('mouseleave', clearHover);
                box.addEventListener('click', inspect);
                el.bboxOverlay.appendChild(box);
            }

            function renderOverlays(page) {
                clearHover();
                el.bboxOverlay.innerHTML = '';

                const extractionItems = [];
                for (const [fieldName, field] of Object.entries(
                    debugData.extraction.fields || {},
                )) {
                    for (const evidence of field.evidence || []) {
                        if (evidence.page === page.page)
                            extractionItems.push({
                                fieldName,
                                field,
                                evidence,
                            });
                    }
                }
                updateCount('layout', page.layout_blocks.length);
                updateCount('ocr', page.ocr_lines.length);
                updateCount('blocks', page.blocks.length);
                updateCount('extraction', extractionItems.length);

                if (layers.layout) {
                    for (const item of page.layout_blocks)
                        addBox(
                            page,
                            'layout',
                            item,
                            item.bbox,
                            'L' + item.id + ' · ' + item.type,
                        );
                }
                if (layers.ocr) {
                    for (const item of page.ocr_lines)
                        addBox(
                            page,
                            'ocr',
                            item,
                            item.bbox,
                            'O' + item.id + ' · ' + item.text,
                            item.block_id,
                        );
                }
                if (layers.blocks) {
                    for (const item of page.blocks)
                        addBox(
                            page,
                            'blocks',
                            item,
                            item.bbox,
                            'B' + item.id + ' · ' + item.type,
                            item.id,
                        );
                }
                if (layers.extraction) {
                    const visibleItems = selectedField
                        ? extractionItems.filter(
                              (item) => item.fieldName === selectedField,
                          )
                        : extractionItems;
                    for (const item of visibleItems) {
                        addBox(
                            page,
                            'extraction',
                            { field: item.fieldName, ...item.evidence },
                            item.evidence.bbox,
                            item.fieldName + ' · ' + item.evidence.rule,
                            item.evidence.block_id,
                            item.fieldName,
                        );
                    }
                }
            }

            async function renderPreviewPage(pageNumber) {
                if (!debugData) return;
                const token = ++renderToken;
                currentPage = pageNumber;
                const page = debugData.pages[pageNumber - 1];
                if (!page) return;

                el.pageNav.style.display =
                    debugData.pages.length > 1 ? 'flex' : 'none';
                el.pageIndicator.textContent =
                    'Trang ' + pageNumber + ' / ' + debugData.pages.length;
                el.prevPageBtn.disabled = pageNumber <= 1;
                el.nextPageBtn.disabled = pageNumber >= debugData.pages.length;
                try {
                    const image = await loadImage(page.image_url);
                    if (token !== renderToken) return;
                    el.previewPlaceholder.style.display = 'none';
                    el.previewCanvasWrap.style.display = '';
                    el.previewCanvas.width = image.naturalWidth;
                    el.previewCanvas.height = image.naturalHeight;
                    el.previewCanvas.getContext('2d').drawImage(image, 0, 0);
                    renderOverlays(page);
                } catch (error) {
                    if (token !== renderToken) return;
                    el.previewCanvasWrap.style.display = 'none';
                    el.previewPlaceholder.style.display = '';
                    el.previewPlaceholder.textContent = error.message;
                }
            }

            document.querySelectorAll('.panel-markdown .tab').forEach((tab) => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    const panel = tab.closest('.panel-markdown');
                    panel
                        .querySelectorAll('.tab')
                        .forEach((item) => item.classList.remove('active'));
                    panel
                        .querySelectorAll('.tab-pane')
                        .forEach((item) => item.classList.remove('active'));
                    tab.classList.add('active');
                    const paneMap = {
                        markdown: el.markdownPane,
                        extraction: el.extractionPane,
                        json: el.jsonOut,
                    };
                    const pane = paneMap[tabName];
                    if (pane) pane.classList.add('active');
                });
            });

            el.layerControls
                .querySelectorAll('input[data-layer]')
                .forEach((input) => {
                    input.addEventListener('change', () => {
                        layers[input.dataset.layer] = input.checked;
                        if (debugData)
                            renderOverlays(debugData.pages[currentPage - 1]);
                    });
                });
            el.prevPageBtn.addEventListener('click', () =>
                renderPreviewPage(currentPage - 1),
            );
            el.nextPageBtn.addEventListener('click', () =>
                renderPreviewPage(currentPage + 1),
            );

            function setFile(file) {
                if (!file) return;
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    setStatus('Chỉ chấp nhận file .pdf', 'err');
                    return;
                }
                selectedFile = file;
                el.filename.textContent =
                    file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
                el.submitBtn.disabled = false;
                setStatus('');
                resetOutput();
            }

            el.fileInput.addEventListener('change', () =>
                setFile(el.fileInput.files[0]),
            );
            ['dragenter', 'dragover'].forEach((name) =>
                el.dropzone.addEventListener(name, (event) => {
                    event.preventDefault();
                    el.dropzone.classList.add('drag');
                }),
            );
            ['dragleave', 'drop'].forEach((name) =>
                el.dropzone.addEventListener(name, (event) => {
                    event.preventDefault();
                    el.dropzone.classList.remove('drag');
                }),
            );
            el.dropzone.addEventListener('drop', (event) =>
                setFile(
                    event.dataTransfer.files && event.dataTransfer.files[0],
                ),
            );

            el.submitBtn.addEventListener('click', async () => {
                if (!selectedFile) return;
                el.submitBtn.disabled = true;
                setStatus('Đang xử lý...');
                el.status.innerHTML =
                    '<span class="spinner"></span>Đang xử lý...';
                el.jsonOut.textContent = 'Đang xử lý...';
                el.mdOut.textContent = 'Đang xử lý...';
                resetOutput();
                el.previewPlaceholder.textContent = 'Đang xử lý...';

                const form = new FormData();
                form.append('file', selectedFile);
                const t0 = performance.now();
                try {
                    const response = await fetch('/api/v1/ocr/pdf', {
                        method: 'POST',
                        body: form,
                        headers: { 'ngrok-skip-browser-warning': 'true' },
                    });
                    const data = await response.json();
                    if (!response.ok)
                        throw new Error(
                            data.detail || 'HTTP ' + response.status,
                        );

                    const clientSeconds = (performance.now() - t0) / 1000;
                    const serverSeconds =
                        typeof data.processing_time === 'number'
                            ? data.processing_time
                            : null;
                    renderTiming(serverSeconds, clientSeconds);
                    el.jsonOut.textContent = JSON.stringify(data, null, 2);
                    apiInformation =
                        (data.information && data.information[0]) || null;
                    debugData = data.debug || null;
                    if (debugData) {
                        el.previewPlaceholder.textContent = 'Chưa có kết quả';
                        renderMarkdown();
                        renderExtractionFields();
                        await renderPreviewPage(1);
                    } else {
                        const message = 'Server đang tắt debug visualization';
                        el.previewPlaceholder.textContent = message;
                        el.mdOut.innerHTML =
                            '<span class="placeholder">' + message + '</span>';
                        renderExtractionFields();
                    }
                } catch (error) {
                    const clientSeconds = (performance.now() - t0) / 1000;
                    debugData = null;
                    apiInformation = null;
                    renderExtractionFields();
                    setStatus(
                        'Lỗi: ' +
                            error.message +
                            ' · ' +
                            formatSeconds(clientSeconds) +
                            ' (tổng)',
                        'err',
                    );
                    el.jsonOut.innerHTML =
                        '<span class="placeholder">Chưa có kết quả</span>';
                    el.mdOut.innerHTML =
                        '<span class="placeholder">Chưa có kết quả</span>';
                    el.previewPlaceholder.textContent = 'Chưa có kết quả';
                } finally {
                    el.submitBtn.disabled = false;
                }
            });
        </script>
    </body>
</html>
